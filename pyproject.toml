[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saveit4u"
version = "0.2.1"
description = "Local native companion for the SaveIt4U browser extension"
requires-python = ">=3.11"
dependencies = ["yt-dlp[default]>=2026.8.19", "psutil>=7.2"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16"]

[project.scripts]
saveit4u-host = "saveit4u.host:main"

[tool.setuptools.packages.find]
where = ["companion"]
