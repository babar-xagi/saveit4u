name: Windows installer
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e ".[build]"
      - run: python scripts/install_ffmpeg.py
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm run check
      - run: python scripts/build_windows.py
      - run: python scripts/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: SaveIt4U-Windows
          path: |
            dist/SaveIt4U-Setup-0.2.0.exe
            dist/saveit4u-extension-0.2.0.zip
          if-no-files-found: error
